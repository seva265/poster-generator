projects:
  - id: "P001"
    name: "Система умного мониторинга растений"
    problem: "Многие люди забывают поливать свои растения или не знают, как правильно ухаживать за ними, что приводит к гибели комнатных цветов."
    solution: "Мы разработали систему автоматического мониторинга состояния растений с уведомлением владельца о необходимости полива и оптимальных условиях содержания."
    product: "Мобильное приложение с интеграцией IoT-датчиков влажности почвы, освещенности и температуры, которое предоставляет персонализированные рекомендации по уходу за каждым растением."
    team: "Иванов Иван, Петрова Мария, Сидоров Алексей"
