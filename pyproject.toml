[tool.poetry]
name = "pd-generator"
version = "0.1.0"
description = "University Project Poster Generator with Streamlit UI"
authors = ["Developer"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
reportlab = "^4.0.0"
Pillow = "^10.0.0"
PyYAML = "^6.0"
streamlit = "^1.30.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
